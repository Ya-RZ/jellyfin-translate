name: build-release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Build desktop app
        run: cargo build --release -p desktop

      - name: Package (exe + zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/desktop.exe dist/JellyfinTranslate.exe
          Copy-Item README.md dist/README.md
          Compress-Archive -Path dist/JellyfinTranslate.exe, dist/README.md `
            -DestinationPath dist/JellyfinTranslate-windows-x64.zip -Force

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-pre
          name: v0.1.0-pre (Windows x64)
          prerelease: true
          # 固定 tag 重复发版时，生成式说明会被追加到已有 body，导致重复。
          # 关闭生成式说明，改用固定模板整体替换 body。
          generate_release_notes: false
          body: |
            Windows x64 便携包。

            - 提交：${{ github.sha }}
            - 构建：#${{ github.run_number }}（[查看运行](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})）
            - 解压后运行 `JellyfinTranslate.exe`；数据保存在 exe 同目录 `data\`。

            这是预发布构建，可能包含未完成的改动。
          files: dist/JellyfinTranslate-windows-x64.zip
          overwrite_files: true
