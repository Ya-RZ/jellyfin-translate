name: build-release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Build desktop app
        run: cargo build --release -p desktop

      - name: Package (exe + zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/desktop.exe dist/JellyfinTranslate.exe
          Copy-Item README.md dist/README.md
          Compress-Archive -Path dist/JellyfinTranslate.exe, dist/README.md `
            -DestinationPath dist/JellyfinTranslate-windows-x64.zip -Force

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-pre
          name: v0.1.0-pre (Windows x64)
          prerelease: true
          generate_release_notes: true
          files: dist/JellyfinTranslate-windows-x64.zip
